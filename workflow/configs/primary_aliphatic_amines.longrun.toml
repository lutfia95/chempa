[input]
path = "out/amine_split/primary_aliphatic_amines.tsv"
smiles_column = "SMILES"
id_columns = ["Label", "CID", "InChIKey", "File", "Index"]
text_columns = ["IUPACName"]

[output]
run_name = "primary_aliphatic_amines_longrun"
root_dir = "workflow/results_longrun"

[standardization]
parent_strategy = "super"
deduplicate = true
drop_invalid = true

[fingerprints]
radius = 2
n_bits = 2048

[embedding]
backend = "molformer"
model_name = "ibm/MoLFormer-XL-both-10pct"
batch_size = 12
max_length = 256
pooling = "mean"
normalize = true
device = "auto"
local_files_only = false

[reduction]
pca_components = 100
umap_cluster_components = 25
umap_plot_components = 2
umap_n_neighbors = 30
umap_min_dist = 0.0
umap_metric = "cosine"
random_state = 42

[clustering]
algorithm = "hdbscan"
min_cluster_size = 8
min_cluster_fraction = 0.005
min_cluster_floor = 8
min_samples = 5
cluster_selection_method = "leaf"

[summary]
top_scaffolds_per_cluster = 10
top_neighbors = 10
descriptor_columns = ["MW", "logP", "HBD", "HBA", "TPSA", "RB", "Rings", "HeavyAtoms", "NumAtoms"]

[runtime]
random_state = 42
numba_cache_dir = "/tmp/numba_cache"
matplotlib_config_dir = "/tmp/mplconfig"
