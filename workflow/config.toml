[input]
path = "out/amine_split/others.tsv" #primary_aliphatic_amines.tsv, secondary_aliphatic_amines.tsv others.tsv aromatic_amines.tsv
smiles_column = "SMILES" #"InputSMILES"
id_columns = ["Label", "CID", "InChIKey"]
text_columns = ["IUPACName"]

[output]
run_name = "aromatic"
root_dir = "workflow/results"

[standardization]
parent_strategy = "fragment"
deduplicate = true
drop_invalid = true

[fingerprints]
radius = 2
n_bits = 2048

[embedding]
backend = "molformer"
model_name = "ibm/MoLFormer-XL-both-10pct"
batch_size = 16
max_length = 256
pooling = "mean"
normalize = true
device = "auto"
local_files_only = false

[reduction]
pca_components = 50
umap_cluster_components = 15
umap_plot_components = 2
umap_n_neighbors = 15
umap_min_dist = 0.1
umap_metric = "cosine"
random_state = 42

[clustering]
algorithm = "hdbscan"
min_cluster_size = 10
min_cluster_fraction = 0.01
min_cluster_floor = 10
cluster_selection_method = "eom"

[summary]
top_scaffolds_per_cluster = 5
top_neighbors = 5
descriptor_columns = ["MW", "logP", "HBD", "HBA", "TPSA", "RB", "Rings"]

[runtime]
random_state = 42
numba_cache_dir = "/tmp/numba_cache"
matplotlib_config_dir = "/tmp/mplconfig"
